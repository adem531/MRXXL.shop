# /sat menüsü
sell:
  # Büyülü ve hasarlı eşyalar da satılır:
  enchant-value-per-level: 10     # her büyü seviyesi için eklenen para
  damaged-min-percent: 10         # çok hasarlı eşya bile fiyatın en az bu yüzdesini eder
  info-name: "&bNasıl çalışır?"
  info-lore:
    - "&7Satmak istediğin eşyaları"
