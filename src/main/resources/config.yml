# ============================================
#  MRXXlShop - Ayar Dosyası (SMP market)
#  Renk kodları için & kullan (örn. &a yeşil, &b açık mavi)
#  Değişiklikten sonra oyunda /shop reload yaz.
# ============================================

settings:
  main-menu-title: "&bMarket"
  main-menu-rows: 5            # 1-6 arası
  category-title: "&bMarket &8» &f{category} &8({page}/{pages})"
  sell-title: "&bEşya Sat"
  filler: true                 # Boş slotları cam ile doldur
  filler-material: LIGHT_BLUE_STAINED_GLASS_PANE   # sade kristal görünüm; GLASS_PANE yaparsan tamamen şeffaf olur
  sell-button-slot: 40
  sell-button-icon: EMERALD

# Shard: oyunda kalarak kazanılır, spawner marketinde harcanır.
shards:
  reward-amount: 1               # her ödülde verilen shard (0 = kapalı)
  reward-interval-minutes: 5     # kaç dakikada bir verilsin
  notify: true                   # ödül gelince oyuncuya mesaj atılsın mı
  # Not: bu üç ayar için sunucuyu yeniden başlat, /shop reload yetmez.

messages:
  prefix: "&8[&bMarket&8] "
  reloaded: "&aAyarlar yeniden yüklendi."
